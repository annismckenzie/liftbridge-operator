---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - apps
  resources:
  - statefulsets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - config.operator.liftbridge.io
  resources:
  - liftbridgeclusters
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - config.operator.liftbridge.io
  resources:
  - liftbridgeclusters/finalizers
  verbs:
  - update
- apiGroups:
  - config.operator.liftbridge.io
  resources:
  - liftbridgeclusters/status
  verbs:
  - get
  - patch
  - update
