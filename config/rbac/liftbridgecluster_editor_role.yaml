# This rule is not used by the project liftbridge-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the config.operator.liftbridge.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: liftbridge-operator
    app.kubernetes.io/managed-by: kustomize
  name: liftbridgecluster-editor-role
rules:
- apiGroups:
  - config.operator.liftbridge.io
  resources:
  - liftbridgeclusters
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - config.operator.liftbridge.io
  resources:
  - liftbridgeclusters/status
  verbs:
  - get
