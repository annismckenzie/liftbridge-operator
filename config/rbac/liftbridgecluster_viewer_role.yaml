# This rule is not used by the project liftbridge-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to config.operator.liftbridge.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: liftbridge-operator
    app.kubernetes.io/managed-by: kustomize
  name: liftbridgecluster-viewer-role
rules:
- apiGroups:
  - config.operator.liftbridge.io
  resources:
  - liftbridgeclusters
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - config.operator.liftbridge.io
  resources:
  - liftbridgeclusters/status
  verbs:
  - get
